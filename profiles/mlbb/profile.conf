# Mobile Legends: Bang Bang profile for mlbb-linux.
# A profile is just the game-specific half of the setup. To support another
# Waydroid game, copy this folder, change these values, and author a mapping.json
# for that game's HUD at the resolution below. See docs/PROFILES.md.

GAME_NAME="Mobile Legends"

# Android package and the activity that launches the match UI.
PKG="com.mobile.legends"
ACTIVITY="com.moba.unityplugin.MobaGameUnityActivity"

# Process name used to confirm the game is alive (pidof "<PKG>:<GAME_PROC>").
# Leave blank to fall back to a plain package match.
GAME_PROC="UnityKillsMe"

# Thread name mlbb-perf samples as the game's main (render) thread.
MAIN_THREAD="UnityMain"

# Keymap, next to this file. Copied into scrcpy-mask's mapping dir on setup.
MAPPING="mapping.json"

# Native resolution the mapping's tap coordinates were authored for. The tap
# positions in mapping.json are in this coordinate space, so a different
# resolution needs its own profile + mapping.
GAME_WIDTH=1920
GAME_HEIGHT=1080

# Supersample: render Android at this size, scaled down into the game window for
# crisper edges. Leave RENDER_WIDTH blank to skip the override.
RENDER_WIDTH=2880
RENDER_HEIGHT=1620
DENSITY=270
