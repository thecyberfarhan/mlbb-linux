# mlbb-linux configuration. `mlbb setup` copies this to
# ~/.config/mlbb-linux/config.conf. Edit it with `mlbb config edit`, or print the
# resolved values (including what auto-detection currently finds) with
# `mlbb config show`. This file is sourced by bash, so keep it as KEY="value".

# Which game profile under profiles/ to use.
PROFILE="mlbb"

# Game monitor connector (e.g. DP-1). Blank = auto-detect the landscape output
# matching the profile's GAME_WIDTH x GAME_HEIGHT on every run, so re-plugging or
# rearranging monitors needs no edit here.
MONITOR=""

# Refresh handling:
#   native  keep the monitor's own refresh rate (recommended)
#   60      lock the monitor to its ~60 Hz mode for the session, restore on stop
# The game renders at 60 fps; on a 75 Hz panel without VRR that judders, so "60"
# is the smoother option if your monitor supports a 60 Hz mode.
REFRESH_MODE="native"

# Android device serial (host:port). Blank = auto-detect Waydroid's IP each run.
# Pin it only if you also have a phone attached over USB ADB.
SERIAL=""

# Override only if you installed scrcpy-mask somewhere non-standard.
SCRCPY_MASK_DIR="$HOME/.local/share/scrcpy-mask/app"

# Extra input-device name substrings for the stuck-touch watchdog to ignore, on
# top of the built-in virtual-device list. Space-separated, case-insensitive.
WATCHDOG_IGNORE=""
