# mlbb-linux: restore Android's internet when Docker is installed.
# Docker sets the iptables FORWARD policy to DROP, which also drops traffic from
# Waydroid's waydroid0 bridge, so Android has no network. These rules allow it,
# re-applied before the container starts on every boot. Installed to
# /etc/systemd/system/waydroid-container.service.d/ by install.sh ONLY if Docker
# is present; harmless to leave if you later remove Docker.
[Unit]
After=docker.service

[Service]
ExecStartPre=-/bin/sh -c "iptables -C DOCKER-USER -i waydroid0 -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -i waydroid0 -j ACCEPT"
ExecStartPre=-/bin/sh -c "iptables -C DOCKER-USER -o waydroid0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -o waydroid0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT"
